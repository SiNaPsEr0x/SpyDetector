version: 2

# Dependabot tiene allineate le action e le dipendenze Python.
# Le action sono gia' pinnate a SHA: Dependabot apre una PR quando lo SHA cambia.
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '05:00'
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: '/scripts'
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    labels: [dependencies, python]

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
