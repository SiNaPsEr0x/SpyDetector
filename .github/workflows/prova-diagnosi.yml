name: Prova delle diagnosi (temporanea)

# Corsa TEMPORANEA: prova due diagnosi prima di applicare le correzioni.
#  1) security-updates.yml fa un checkout shallow (fetch-depth di default = 1)
#     e poi chiede a create-pull-request di pushare un branch nuovo: il server
#     rifiuta gli aggiornamenti shallow, git esce 1 e la PR non nasce. Qui si
#     riproduce il push da clone shallow. Se contro ogni attesa riuscisse, il
#     branch viene cancellato nello stesso passo.
#  2) gh attestation verify dentro il runner non aveva funzionato, con
#     l'annotazione vuota. Qui si prova sull'APK gia' pubblicato, con permessi
#     di sola lettura e con l'output appiattito su una riga perche' le
#     annotazioni si troncano al primo a-capo.
# Questo file viene eliminato appena le due risposte sono note.

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

concurrency:
  group: prova-diagnosi
  cancel-in-progress: true

jobs:
  shallow:
    name: Push da clone shallow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # nessuna fetch-depth: e' il default shallow di security-updates.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Profondita' del clone
        run: |
          set -euo pipefail
          echo "commit nel clone: $(git rev-list --count HEAD)"
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            echo "il clone E' shallow"
          else
            echo "il clone non e' shallow"
          fi

      - name: Sequenza git di create-pull-request, comando per comando
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # l'action sceglie un nome di branch temporaneo con un uuid
          TMP="tmp-$(date +%s)-$$"
          PROVA="prova/cpr-$GITHUB_RUN_ID"

          prova() {
            # esegue il comando e dice come e' finita: l'action non tollera
            # codici diversi da zero su checkout, reset, rev-list, stash e push
            ETICHETTA="$1"; shift
            if OUT=$("$@" 2>&1); then
              echo "ok    $ETICHETTA"
            else
              RC=$?
              echo "::warning::$ETICHETTA uscita $RC: ${OUT//$'\n'/ | }"
              echo "FALLITO $ETICHETTA" >> /tmp/esiti.txt
            fi
          }

          prova "checkout -B $TMP HEAD" git checkout --progress -B "$TMP" HEAD --
          # una modifica dentro uno degli add-paths di security-updates.yml
          echo "" >> docs/security/iocs.md
          prova "add dei percorsi" git add --force -- docs/security/ .github/workflows \
            tools/toolchain.env data/threat-seed.txt data/official-signatures.txt \
            app/src/main/java/it/spydetector/app/core/ThreatDbGenerated.java
          prova "commit" git commit -q -m "prova: modifica per la diagnosi"
          prova "stash push --include-untracked" git stash push --include-untracked
          prova "checkout della base" git checkout --progress "$BASE" --
          prova "reset --hard origin/$BASE" git reset --hard "origin/$BASE"
          prova "checkout -B $PROVA" git checkout --progress -B "$PROVA" "$TMP" --
          prova "rev-list --right-only --count" git rev-list --right-only --count \
            "$BASE...$PROVA"
          prova "push --force-with-lease" git push --force-with-lease origin \
            "$PROVA:refs/heads/$PROVA"
          prova "push semplice (confronto)" git push origin "$PROVA:refs/heads/$PROVA"

          if git ls-remote --heads origin "$PROVA" | grep -q .; then
            echo "il branch di prova esiste: lo cancello"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$PROVA" >/dev/null 2>&1 \
              || echo "::error::cancellazione di $PROVA fallita, va fatta a mano"
          else
            echo "nessun branch creato: la sequenza si e' fermata prima"
          fi
          if [ -f /tmp/esiti.txt ]; then
            echo "::warning::comandi falliti: $(tr '\n' '; ' < /tmp/esiti.txt)"
          else
            echo "::notice::nessun comando della sequenza e' fallito"
          fi

  attestazioni:
    name: Verifica dell'attestazione pubblicata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Scarica l'APK pubblicato
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p scarico
          gh release download --pattern '*.apk' --dir scarico
          APK="$(find scarico -maxdepth 1 -name '*.apk' | head -1)"
          echo "apk=$APK" >> "$GITHUB_ENV"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK scaricato: $APK"

      - name: gh attestation verify (come documentato nelle note)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "gh $(gh --version | head -1)"
          if ERR=$(gh attestation verify "$apk" --repo "$GH_REPO" 2>&1); then
            echo "::notice::verify riuscito: ${ERR//$'\n'/ | }"
          else
            echo "::warning::verify fallito (exit $?): ${ERR//$'\n'/ | }"
          fi

      - name: L'attestazione e' recuperabile via API per digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if ERR=$(gh api "repos/$GH_REPO/attestations/sha256:$sha256" \
                   --jq '.attestations | length' 2>&1); then
            echo "::notice::attestazioni trovate per digest: $ERR"
          else
            echo "::warning::api attestazioni fallita: ${ERR//$'\n'/ | }"
          fi
