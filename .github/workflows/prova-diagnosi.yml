name: Prova delle diagnosi (temporanea)

# Corsa TEMPORANEA. L'A/B ha gia' risposto: create-pull-request muore con
# "The process '/usr/bin/git' failed with exit code 1" quando il commit tocca
# .github/workflows/, e riesce quando tocca solo altri file. L'action pero'
# ingoia lo stderr di git nel log del runner, che da qui non e' leggibile.
# Questo job fa il push a mano e stampa il messaggio del server in
# un'annotazione, cosi' la causa resta scritta e non ipotizzata.
# File da eliminare subito dopo.

on:
  push:
    branches: ['arena/**']

permissions:
  contents: write

concurrency:
  group: prova-diagnosi
  cancel-in-progress: true

jobs:
  messaggio:
    name: Messaggio del server sul push di una workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push a mano di un commit che tocca una workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROVA: prova/push-workflow
        run: |
          set -uo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "# riga di prova" >> .github/workflows/prova-diagnosi.yml
          git add .github/workflows/prova-diagnosi.yml
          git commit -q -m "prova: commit che tocca un file di workflow"
          if ERR=$(git push origin "HEAD:refs/heads/$PROVA" 2>&1); then
            echo "::warning::push di una workflow RIUSCITO: ipotesi sbagliata, cancello $PROVA"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$PROVA" >/dev/null 2>&1 || true
          else
            echo "codice di uscita: $?"
            echo "::notice::push di una workflow rifiutato dal server: ${ERR//$'\n'/ | }"
          fi

      - name: 'Controllo: push di un commit che NON tocca una workflow'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROVA: prova/push-docs
        run: |
          set -uo pipefail
          git checkout -q -- .github/workflows/prova-diagnosi.yml 2>/dev/null || true
          echo "" >> docs/security/iocs.md
          git add docs/security/iocs.md
          git commit -q -m "prova: commit che tocca solo documentazione"
          if ERR=$(git push origin "HEAD:refs/heads/$PROVA" 2>&1); then
            echo "::notice::push senza workflow riuscito: cancello $PROVA"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$PROVA" >/dev/null 2>&1 \
              || echo "::warning::cancellazione di $PROVA non riuscita"
          else
            echo "::warning::anche il push senza workflow e' fallito: ${ERR//$'\n'/ | }"
          fi
