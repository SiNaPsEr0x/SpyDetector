name: Prova delle diagnosi (temporanea)

# Corsa TEMPORANEA. Domanda: perche' il passo "Apri/aggiorna la PR" di
# security-updates.yml moriva con "The process '/usr/bin/git' failed with exit
# code 1"? Le corse fallite sono quelle in cui update-pins.py aveva modificato
# file dentro .github/workflows/, e il GITHUB_TOKEN non ha uno scope
# "workflows" concedibile (actionlint lo conferma: gli scope disponibili sono
# actions, attestations, checks, contents, ... e workflows non c'e').
#
# A/B: stessa action, stessi permessi (contents + pull-requests), stesso branch
# di base; cambia solo COSA viene modificato — un file di workflow oppure un
# file di documentazione. Le PR nascono bozza e vengono chiuse nello stesso job.
# File da eliminare appena la risposta e' nota.

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

concurrency:
  group: prova-diagnosi
  cancel-in-progress: true

jobs:
  modifica-workflow:
    name: PR che tocca un file di workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Modifica a un file di workflow
        run: |
          set -euo pipefail
          echo "# riga di prova" >> .github/workflows/prova-diagnosi.yml
          git --no-pager status --porcelain -unormal

      - name: create-pull-request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.SPD_PR_TOKEN || github.token }}
          branch: prova/tocca-workflow
          base: ${{ github.ref_name }}
          draft: true
          title: 'prova: modifica a un file di workflow (bozza)'
          commit-message: 'prova: modifica a un file di workflow'

      - name: Esito e pulizia
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "::notice::modifica a una WORKFLOW: esito del passo PR = ${{ steps.pr.outcome }}"
          PR="$(gh pr list --state open --head prova/tocca-workflow --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr close "$PR" --delete-branch >/dev/null 2>&1 \
              || echo "::warning::chiusura della bozza #$PR non riuscita"
          fi

  modifica-codice:
    name: PR che tocca solo documentazione
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Modifica a un file di documentazione
        run: |
          set -euo pipefail
          echo "" >> docs/security/iocs.md
          git --no-pager status --porcelain -unormal

      - name: create-pull-request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.SPD_PR_TOKEN || github.token }}
          branch: prova/tocca-docs
          base: ${{ github.ref_name }}
          draft: true
          title: 'prova: modifica alla documentazione (bozza)'
          commit-message: 'prova: modifica alla documentazione'

      - name: Esito e pulizia
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "::notice::modifica alla DOCUMENTAZIONE: esito del passo PR = ${{ steps.pr.outcome }}"
          PR="$(gh pr list --state open --head prova/tocca-docs --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr close "$PR" --delete-branch >/dev/null 2>&1 \
              || echo "::warning::chiusura della bozza #$PR non riuscita"
          fi
