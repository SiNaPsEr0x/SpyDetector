name: Automerge aggiornamenti

# Tutte le PR vengono unite automaticamente SOLO se TUTTI i check obbligatori
# sono verdi: build APK, verifica, actionlint, gate di qualita', SAST, CodeQL,
# secret scanning, dependency review, vulnerability scan, malware scan.
# Per Dependabot gli aggiornamenti major restano manuali.
#
# Dopo il merge: un merge eseguito con il GITHUB_TOKEN non genera eventi push,
# quindi le workflow che partono su push verso main non si innescherebbero
# (regola anti-ricorsione di GitHub; le eccezioni sono workflow_dispatch e
# repository_dispatch). L'ultimo passo riavvia esplicitamente quelle che la PR
# non ha gia' visto: Release (ricostruisce e pubblica l'APK) e Malware/IOC.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # serve solo a riavviare esplicitamente le workflow su main dopo il merge
  actions: write

concurrency:
  group: automerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Merge se verde
    runs-on: ubuntu-latest
    # una bozza non e' fondibile: aspettare i check per poi farsi rispondere
    # "Draft pull requests cannot be merged" produce solo una corsa rossa. La
    # PR torna qui da sola quando viene segnata pronta (ready_for_review).
    if: github.event.pull_request.draft == false
    # il passo di attesa non ha un timeout proprio: senza questo limite una PR
    # i cui check non partono mai (es. corsa in attesa di approvazione) tiene
    # occupato un runner per le sei ore del default
    timeout-minutes: 120
    steps:
      - name: Attendi i check obbligatori
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: '(Build \+ verifica APK|Gate di qualita|Actionlint|CodeQL|Semgrep|gitleaks|Vulnerabilita.*dipendenze|OSV Scanner|Trivy|ClamAV)'
          wait-interval: 20
          allowed-conclusions: success,skipped,neutral
          running-workflow-name: 'Automerge aggiornamenti'

      - name: Merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # questo job non fa checkout: gh ricava la repo dal remoto git, che
          # qui non esiste (la variabile GITHUB_REPOSITORY non gli basta)
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # il titolo non va mai interpolato in uno script: passa da env
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # niente major automatiche per Dependabot
          if echo "$PR_TITLE" | grep -qiE 'bump .* from [0-9]+ to [0-9]+$|bump .* from v?[0-9]+ to v?[0-9]+$'; then
            FROM=$(echo "$PR_TITLE" | sed -n 's/.*from v\?\([0-9]*\).*/\1/p')
            TO=$(echo "$PR_TITLE" | sed -n 's/.*to v\?\([0-9]*\).*/\1/p')
            if [ -n "$FROM" ] && [ -n "$TO" ] && [ "$FROM" != "$TO" ]; then
              echo "salto: aggiornamento major ($FROM -> $TO) da verificare a mano"
              exit 0
            fi
          fi
          # piccola pausa per permettere a GitHub di aggiornare lo stato mergeable
          sleep 5
          # usa gh api (non gh pr merge): più robusto e restituisce errori JSON chiari
          gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/merge" \
            -f merge_method=squash 2>&1 || {
            echo "::error::merge fallito — stato PR:"
            gh pr view "$PR" --json state,mergeable,mergeStateStatus 2>&1
            exit 1
          }
          echo "PR $PR unita con successo (squash)"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Riavvia le workflow su main dopo il merge
        # CodeQL, SAST, secret scanning, dependency review e vulnerability scan
        # hanno gia' controllato la PR e sono condizione del merge: qui ripartono
        # solo le due che una PR non vede mai, perche' ascoltano esclusivamente
        # i push verso main. Il dispatch non crea loop: Release committa il bump
        # di VERSION con [skip ci] e Malware/IOC non committa nulla.
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # senza checkout gh non determina la repo da solo: il dispatch fallisce
          # con "failed to determine base repo" e nessuno lo vede
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$BASE" != "$DEFAULT_BRANCH" ]; then
            echo "salto: PR verso $BASE, non verso $DEFAULT_BRANCH"
            exit 0
          fi
          for WF in release.yml malware-scan.yml; do
            if ERR=$(gh workflow run "$WF" --ref "$DEFAULT_BRANCH" 2>&1); then
              echo "riavviata $WF su $DEFAULT_BRANCH"
            else
              # i log del runner non sono sempre raggiungibili: l'errore vero va
              # nelle annotazioni e nel riepilogo, non in un avviso generico
              echo "::warning::$WF non riavviata: $ERR"
              {
                echo "### Merge fatto, riavvio fallito"
                echo ""
                echo "\`$WF\` su \`$DEFAULT_BRANCH\`: \`$ERR\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Elimina il branch di correzione del ciclo
        # create-pull-request cancella il branch solo quando e' lui a fondere;
        # qui il merge passa dall'API, quindi il branch curato resterebbe per
        # sempre. Vale solo per i branch del ciclo: quelli delle persone e
        # chore/security-updates (che lo riusa ogni notte) non si toccano.
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -uo pipefail
          case "$HEAD_BRANCH" in
            fix/self-heal/*) ;;
            *) echo "branch non del ciclo ($HEAD_BRANCH): lo lascio dov'e'"; exit 0 ;;
          esac
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "PR da un fork ($HEAD_REPO): i branch altrui non si toccano"
            exit 0
          fi
          if ERR=$(gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$HEAD_BRANCH" 2>&1); then
            echo "eliminato il branch di correzione $HEAD_BRANCH"
          else
            echo "::warning::branch $HEAD_BRANCH non eliminato: $ERR"
          fi
