name: Automerge aggiornamenti

# Tutte le PR vengono unite automaticamente SOLO se TUTTI i check obbligatori
# sono verdi: build APK, verifica, actionlint, gate di qualita', SAST, CodeQL,
# secret scanning, dependency review, vulnerability scan, malware scan.
# Per Dependabot gli aggiornamenti major restano manuali.
#
# Dopo il merge: un merge eseguito con il GITHUB_TOKEN non genera eventi push,
# quindi le workflow che partono su push verso main non si innescherebbero
# (regola anti-ricorsione di GitHub; le eccezioni sono workflow_dispatch e
# repository_dispatch). L'ultimo passo riavvia esplicitamente quelle che la PR
# non ha gia' visto: Release (ricostruisce e pubblica l'APK) e Malware/IOC.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # serve solo a riavviare esplicitamente le workflow su main dopo il merge
  actions: write

concurrency:
  group: automerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Merge se verde
    runs-on: ubuntu-latest
    steps:
      - name: Attendi i check obbligatori
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: '(Build \+ verifica APK|Gate di qualita|Actionlint|CodeQL|Semgrep|gitleaks|Vulnerabilita.*dipendenze|OSV Scanner|Trivy|ClamAV)'
          wait-interval: 20
          allowed-conclusions: success,skipped,neutral
          running-workflow-name: 'Automerge aggiornamenti'

      - name: Merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          # il titolo non va mai interpolato in uno script: passa da env
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # niente major automatiche per Dependabot
          if echo "$PR_TITLE" | grep -qiE 'bump .* from [0-9]+ to [0-9]+$|bump .* from v?[0-9]+ to v?[0-9]+$'; then
            FROM=$(echo "$PR_TITLE" | sed -n 's/.*from v\?\([0-9]*\).*/\1/p')
            TO=$(echo "$PR_TITLE" | sed -n 's/.*to v\?\([0-9]*\).*/\1/p')
            if [ -n "$FROM" ] && [ -n "$TO" ] && [ "$FROM" != "$TO" ]; then
              echo "salto: aggiornamento major ($FROM -> $TO) da verificare a mano"
              exit 0
            fi
          fi
          # piccola pausa per permettere a GitHub di aggiornare lo stato mergeable
          sleep 5
          # usa gh api (non gh pr merge): più robusto e restituisce errori JSON chiari
          gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/merge" \
            -f merge_method=squash 2>&1 || {
            echo "::error::merge fallito — stato PR:"
            gh pr view "$PR" --json state,mergeable,mergeStateStatus 2>&1
            exit 1
          }
          echo "PR $PR unita con successo (squash)"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Riavvia le workflow su main dopo il merge
        # CodeQL, SAST, secret scanning, dependency review e vulnerability scan
        # hanno gia' controllato la PR e sono condizione del merge: qui ripartono
        # solo le due che una PR non vede mai, perche' ascoltano esclusivamente
        # i push verso main. Il dispatch non crea loop: Release committa il bump
        # di VERSION con [skip ci] e Malware/IOC non committa nulla.
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE" != "$DEFAULT_BRANCH" ]; then
            echo "salto: PR verso $BASE, non verso $DEFAULT_BRANCH"
            exit 0
          fi
          for WF in release.yml malware-scan.yml; do
            if gh workflow run "$WF" --ref "$DEFAULT_BRANCH"; then
              echo "riavviata $WF su $DEFAULT_BRANCH"
            else
              echo "::warning::$WF non riavviata: da lanciare a mano"
            fi
          done
