name: Automerge aggiornamenti

# Tutte le PR vengono unite automaticamente SOLO se TUTTI i check obbligatori
# sono verdi: build APK, verifica, actionlint, SAST, CodeQL, secret scanning,
# dependency review, vulnerability scan, malware scan.
# Per Dependabot gli aggiornamenti major restano manuali.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Merge se verde
    runs-on: ubuntu-latest
    steps:
      - name: Attendi i check obbligatori
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: '(Build \+ verifica APK|Actionlint|CodeQL|Semgrep|gitleaks|Vulnerabilita.*dipendenze|OSV Scanner|Trivy|ClamAV)'
          wait-interval: 20
          allowed-conclusions: success,skipped,neutral
          running-workflow-name: 'Automerge aggiornamenti'

      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          # il titolo non va mai interpolato in uno script: passa da env
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # niente major automatiche per Dependabot
          if echo "$PR_TITLE" | grep -qiE 'bump .* from [0-9]+ to [0-9]+$|bump .* from v?[0-9]+ to v?[0-9]+$'; then
            FROM=$(echo "$PR_TITLE" | sed -n 's/.*from v\?\([0-9]*\).*/\1/p')
            TO=$(echo "$PR_TITLE" | sed -n 's/.*to v\?\([0-9]*\).*/\1/p')
            if [ -n "$FROM" ] && [ -n "$TO" ] && [ "$FROM" != "$TO" ]; then
              echo "salto: aggiornamento major ($FROM -> $TO) da verificare a mano"
              exit 0
            fi
          fi
          # piccola pausa per permettere a GitHub di aggiornare lo stato mergeable
          sleep 5
          # usa gh api (non gh pr merge): più robusto e restituisce errori JSON chiari
          gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/merge" \
            -f merge_method=squash 2>&1 || {
            echo "::error::merge fallito — stato PR:"
            gh pr view "$PR" --json state,mergeable,mergeStateStatus 2>&1
            exit 1
          }
          echo "PR $PR unita con successo (squash)"
