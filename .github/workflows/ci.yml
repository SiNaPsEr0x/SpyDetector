name: CI

# Su main il build+release e' gestito da release.yml (ogni push su main rifa
# l'APK); qui si costruisce solo per le branch di lavoro e le PR.
#
# I tre job condividono le action composite in .github/actions/: la stessa
# definizione di "prepara la toolchain" e di "esegui i gate" usata anche da
# release.yml, malware-scan.yml, security-updates.yml e self-heal.yml.
# Se una verifica fallisce, auto-fix-on-failure.yml avvia il ciclo di
# self-healing che prova a riparare e riapre una PR da ricontrollare.

on:
  push:
    branches: ['arena/**']
  # tutte le PR, non solo quelle verso main: automerge.yml unisce una PR solo
  # se i check obbligatori sono verdi, e per farlo i check devono esistere
  # anche quando la PR punta a un branch di lavoro (es. fix/self-heal/*)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Actionlint (workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (sintassi e semantica delle workflow)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
          shellcheck: true

  gates:
    name: Gate di qualita'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # il meccanismo che corregge deve essere corretto lui per primo:
      # difetti iniettati in una copia del repo, il ciclo deve ripararli tutti
      - name: Self-test del ciclo di self-healing
        run: python3 scripts/test-selfheal.py

      # senza rete: prova la logica che sceglie le versioni dei pin. Da sola
      # leggeva le prime cifre dello SHA come major e retrocedeva le action
      - name: Prova della logica dei pin
        run: python3 scripts/update-pins.py --selftest

      # senza build: l'APK lo compila il job qui sotto (niente download doppi)
      - name: Gate sul repository
        uses: ./.github/actions/quality-gates
        with:
          with-build: 'false'
          fail-on: error

  build:
    name: Build + verifica APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain di build
        id: tc
        uses: ./.github/actions/setup-toolchain
        with:
          python-version: '3.12'
          cache: 'true'

      - name: Build APK di release
        run: ./build.sh

      - name: Verifica funzionamento dell'APK
        run: python3 scripts/verify-apk.py dist/*.apk

      - name: Firma (apksigner verify)
        env:
          # java e apksigner vengono dalla toolchain pinnata, non dal runner
          JAVA: ${{ steps.tc.outputs.java }}
          APKSIGNER: ${{ steps.tc.outputs.apksigner }}
        run: |
          set -euo pipefail
          "$JAVA" -jar "$APKSIGNER" verify --min-sdk-version 26 --verbose dist/*.apk\
            | tee build/apksigner-verify.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpyDetector-apk
          path: |
            dist/*.apk
            dist/*.sha256
            build/apksigner-verify.txt
          if-no-files-found: error
          retention-days: 14
