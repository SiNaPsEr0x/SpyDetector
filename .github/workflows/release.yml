name: Release

# Ricostruisce e pubblica l'APK:
# - su OGNI push su main (ogni modifica al codice): rebuild, verifica, SBOM,
#   attestazioni e upload della release — sempre una sola release online
# - su un tag v* (./scripts/release.sh 1.1.0)
# - a mano (workflow_dispatch)
#
# Versione: ogni APK pubblicato utilizza la versione in VERSION; a fine
# workflow, se la corsa è automatica (push su main o dispatch senza input),
# la versione avanza di 0.0.1 (patch +1) e il bump viene commettito in repo
# con [skip ci] (niente loop). Le release esplicite (input manuale o marker
# "release:" in HEAD da release.sh) non avanzano la versione. Se main è
# mosso da push intervenute durante il build, il bump viene riportato con
# rebase sulla punta remota prima del push (il push non viene respinto).

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 1.1.0). Vuoto = contenuto di VERSION'
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build + release firmata e attestata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Versione
        id: ver
        env:
          # l'input manuale non va mai interpolato nello script: passa da env
          SPD_INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          V="$(tr -d '[:space:]' < VERSION)"
          if [ -n "$SPD_INPUT_VERSION" ]; then
            # finisce in VERSION, nel tag e in un messaggio di commit: deve
            # essere un semver pulito, niente shell o caratteri strani
            if ! printf '%s' "$SPD_INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::versione non valida: '$SPD_INPUT_VERSION' (atteso X.Y.Z)"
              exit 1
            fi
            # release esplicita (release.sh o dispatch manuale con input):
            # scrivi la versione e committa con il marker "release:" così
            # l'auto-bump a fine workflow non la modifica
            echo "$SPD_INPUT_VERSION" > VERSION
            git add VERSION
            git commit -m "release: v$SPD_INPUT_VERSION [skip ci]" || true
            git push
            V="$SPD_INPUT_VERSION"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "SpyDetector v$V"

      # la stessa action composite usata da ci.yml e malware-scan.yml
      - name: Toolchain di build
        id: tc
        uses: ./.github/actions/setup-toolchain
        with:
          python-version: '3.12'
          cache: 'true'

      - name: Build APK di release
        env:
          VERSION_CODE: ${{ github.run_number }}
          # opzionali: chiave di firma custodita nei secrets (consigliata)
          SPD_KS_B64: ${{ secrets.SPD_KS_B64 }}
          SPD_KS_PASS: ${{ secrets.SPD_KS_PASS }}
          SPD_KEY_ALIAS: ${{ secrets.SPD_KEY_ALIAS }}
          SPD_KEY_PASS: ${{ secrets.SPD_KEY_PASS }}
        run: ./build.sh

      - name: Verifica funzionamento dell'APK
        run: python3 scripts/verify-apk.py dist/*.apk

      - name: Firma e allineamento (apksigner verify)
        env:
          JAVA: ${{ steps.tc.outputs.java }}
          APKSIGNER: ${{ steps.tc.outputs.apksigner }}
        run: |
          set -euo pipefail
          "$JAVA" -jar "$APKSIGNER" verify --min-sdk-version 26 --verbose dist/*.apk\
            | tee build/apksigner-verify.txt

      - name: SBOM (SPDX) dell'APK
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/SpyDetector-v${{ steps.ver.outputs.version }}-release.apk
          format: spdx-json
          output-file: dist/SpyDetector-v${{ steps.ver.outputs.version }}-release.apk.spdx.json
          artifact-name: ''

      - name: Attestazione di provenienza (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.apk'

      - name: Attestazione SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/*.apk'
          sbom-path: 'dist/SpyDetector-v${{ steps.ver.outputs.version }}-release.apk.spdx.json'

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpyDetector-release
          path: dist/*

      - name: Pulizia release precedenti (una sola versione online)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isLatest\
            --jq '.[] | select(.isLatest|not) | .tagName' | while read -r OLD; do
              [ -z "$OLD" ] && continue
              echo "elimino release vecchia: $OLD"
              gh release delete "$OLD" --yes --cleanup-tag || true
            done

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          NOTES=$(cat <<EOF
          **SpyDetector $TAG** — APK di release firmato (Android 8.0+).

          Installazione: scarica l'APK, aprilo sul telefono, consenti "Installa da questa origine".

          Verifica del download:
          \`\`\`
          sha256sum SpyDetector-v${{ steps.ver.outputs.version }}-release.apk
          \`\`\`
          Provenienza verificabile con \`gh attestation verify <file> --repo ${{ github.repository }}\`.

          \`\`\`
          $(cat build/apksigner-verify.txt)
          \`\`\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --latest --notes "$NOTES"
          else
            gh release create "$TAG" dist/* --title "SpyDetector $TAG" --notes "$NOTES" --latest
          fi

      - name: Auto-bump versione (+0.0.1 a ogni APK creato)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.inputs.version
        run: |
          # input manuale: la condizione del passo ha gia' escluso il bump;
          # qui resta solo il check del marker "release:" (release.sh)
          if git log -1 --pretty=%B | grep -q '^release:'; then
            echo "release esplicita: nessun auto-bump"
            exit 0
          fi
          V="$(tr -d '[:space:]' < VERSION)"
          BUMP="$(echo "$V" | awk -F. '{print $1"."$2"."($3+1)}')"
          echo "$BUMP" > VERSION
          git add VERSION
          git commit -m "chore: versione $BUMP [skip ci]" || true
          # main potrebbe essere mosso da push intervenute durante il build:
          # riporta il bump commit sulla punta remota (rebase) prima di
          # pushare, altrimenti il push viene respinto e la versione
          # avanzata andrebbe persa
          git fetch origin main
          if ! git rebase origin/main 2>/dev/null; then
            echo "rebase fallito (conflitto su VERSION?): bump saltato"
            git rebase --abort || true
            exit 0
          fi
          git push
          echo "Versione avanzata: $V -> $BUMP (prossimo APK)"
